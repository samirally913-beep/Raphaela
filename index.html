<!doctype html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769e0">
  <title>CampusBite Tanzania</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="app">
  <section id="authView" class="screen auth-screen">
    <div class="brand">
      <div id="authCollegeLogo" class="logo college-logo">🍽️</div>
      <div><h1>CampusBite</h1><p>Campus food made simple</p></div>
    </div>
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" onclick="showAuth('login')">Ingia</button>
        <button class="tab" onclick="showAuth('register')">Jisajili</button>
      </div>
      <div id="loginForm">
        <label>College/University ID</label><input id="loginCollege" placeholder="COL-000123">
        <label>Student Registration Number</label><input id="loginStudent" placeholder="2026-00123">
        <label>Password</label><input id="loginPass" type="password" placeholder="••••••••">
        <button class="primary" onclick="loginStudent()">Ingia</button>
        <button class="demo-link" onclick="demoLogin()">Tumia demo student</button>
        <hr>
        <button class="secondary" onclick="adminLogin()">Admin demo</button>
        <button class="secondary" onclick="vendorLogin()">Vendor demo</button>
      </div>
      <div id="registerForm" class="hidden">
        <label>College/University ID</label><input id="regCollege" placeholder="COL-000123">
        <label>Student Registration Number</label><input id="regStudent" placeholder="2026-00123">
        <label>Full Name</label><input id="regName" placeholder="Jina kamili">
        <label>WhatsApp Number</label><input id="regPhone" placeholder="+255...">
        <label>Create Password</label><input id="regPass" type="password" placeholder="••••••••">
        <button class="primary" onclick="registerStudent()">Tengeneza akaunti</button>
        <p class="hint">Namba ya mwanafunzi lazima iwe imeongezwa na Admin kwanza.</p>
      </div>
    </div>
  </section>

  <section id="mainView" class="hidden">
    <header class="topbar">
      <div class="brand small"><div id="topCollegeLogo" class="logo college-logo">🍽️</div><div><strong>CampusBite</strong><span id="roleLabel"></span></div></div>
      <button class="icon-btn" onclick="logout()">↪</button>
    </header>
    <main id="content"></main>
    <nav id="nav" class="bottom-nav"></nav>
  </section>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
